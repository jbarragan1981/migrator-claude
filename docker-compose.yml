# apps/web todavía es un placeholder (M4); el servicio `web` se agrega cuando exista
# la app Angular real. Por ahora `docker compose up` levanta solo la API.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Nunca en true en Docker Compose (spec 06 CA-9): el modo local expondría
      # rutas del filesystem del host contenedor, no tiene sentido para un usuario
      # que sube su export por la API.
      CEM_ALLOW_LOCAL_PATHS: "false"
      CEM_MAX_UPLOAD_MB: "2048"
      CEM_JOB_TIMEOUT_S: "300"
    healthcheck:
      # Sin curl en python:3.12-slim-bookworm (observacion 5): urllib de la propia
      # stdlib de Python siempre esta disponible en la imagen.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
