[project]
name = "claude-export-md"
version = "0.1.0"
description = "Librería pura para convertir una exportación de datos de Claude.ai en Markdown navegable."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "ijson>=3.3",
  "jinja2>=3.1",
  "python-frontmatter>=1.1",
  # El frontmatter se emite con el dumper de PyYAML (no a mano) para que sea YAML
  # válido con cualquier contenido del usuario. Ya venía como dependencia transitiva
  # de python-frontmatter; aquí es explícita porque `rendering/filters.py` la importa.
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "syrupy>=4.7",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_export_md"]
