name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar Python
        run: uv python install 3.12

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Habilitar pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Instalar just
        uses: extractions/setup-just@v2

      - name: just setup
        run: just setup

      - name: just lint
        run: just lint

      - name: just test
        run: just test
