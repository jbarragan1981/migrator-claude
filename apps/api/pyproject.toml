[project]
name = "claude-export-md-api"
version = "0.1.0"
description = "API FastAPI para claude-export-md (M3)."
requires-python = ">=3.12"
dependencies = [
  "claude-export-md",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[tool.uv.sources]
claude-export-md = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_export_md_api"]
