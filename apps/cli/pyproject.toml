[project]
name = "claude-export-md-cli"
version = "0.1.0"
description = "CLI (Typer) para claude-export-md."
requires-python = ">=3.12"
dependencies = [
  "claude-export-md",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
claude-export-md = "claude_export_md_cli.main:app"

[tool.uv.sources]
claude-export-md = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_export_md_cli"]
