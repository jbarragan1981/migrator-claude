server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, el default de nginx (1m) rechaza la subida del export ANTES de
    # que llegue a la API - CEM_MAX_UPLOAD_MB (docker-compose.yml, default 2048)
    # es el limite real que aplica services/exports.py; este valor tiene que ser
    # igual o mayor para que ese limite sea el que de verdad se cumple.
    client_max_body_size 2048m;

    # Mismo criterio que apps/web/proxy.conf.json en desarrollo: /api y /health
    # van sin reescribir al servicio `api` de docker-compose.yml (los routers de
    # la API ya viven bajo /api/v1, main.py). `proxy_buffering off` es necesario
    # para GET /api/v1/jobs/{id}/events (SSE del progreso de conversion): con
    # buffering nginx retiene los eventos hasta juntar un buffer completo en vez
    # de reenviarlos en cuanto llegan, y la barra de progreso del front se
    # quedaria "colgada" hasta que la conversion entera terminara.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # Angular es una SPA: cualquier ruta que no sea un archivo real (p. ej.
    # /inventory/abc123 al recargar la pagina) cae a index.html y el router de
    # Angular decide que pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
