      fallback (`font: var(--mat-sys-body-medium)` en styles.scss ya incluye una pila
      sans-serif); si una pantalla futura necesita iconos, usar `mat-icon` con SVGs
      registrados localmente en vez de la fuente de ligaduras de Google.
